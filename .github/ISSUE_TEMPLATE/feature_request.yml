name: Feature Request
description: Suggest an idea or improvement for AIOS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AIOS follows a **Minimum Core** principle: capabilities that can live as
        plugins or external modules generally should, rather than being added to
        the runtime core. Please keep this in mind when proposing a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? What is the use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: core-or-plugin
    attributes:
      label: Where does this belong?
      options:
        - Plugin / external module
        - Runtime core (please justify below)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
